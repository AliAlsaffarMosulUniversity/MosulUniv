<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>جامعة الموصل</title>
  <meta name="description" content="التطبيق الرسمي لمتابعة أخبار ونشاطات كليات ومراكز جامعة الموصل">
  <meta name="theme-color" content="#12304f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="جامعة الموصل">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <img class="seal" src="https://uomosul.edu.iq/wp-content/uploads/2023/03/UOM-logo.png" alt=""
           onerror="this.onerror=null;this.src='icons/icon-192.png'">
      <div class="titles">
        <h1 data-i18n="appName">جامعة الموصل</h1>
        <div class="sub" id="today"></div>
      </div>
      <button class="lang-btn" id="lang" aria-label="English">EN</button>
      <button class="icon-btn" id="theme" aria-label="الوضع الداكن">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      </button>
      <button class="icon-btn" id="refresh" data-i18n-aria="refresh" aria-label="تحديث البيانات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="banner" id="banner" hidden></div>

    <!-- الرئيسية -->
    <section class="view on" id="v-home">
      <div class="hero">
        <svg class="hero-arch" viewBox="0 0 40 52" aria-hidden="true"><path d="M4 50V24 Q4 10 20 2 Q36 10 36 24V50" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M1 50h38" stroke="currentColor" stroke-width="2.4"/></svg>
        <div>
          <h2 class="hero-title" data-i18n="heroTitle">نبض جامعة الموصل</h2>
          <p class="hero-sub" data-i18n="heroSub">متابعة أسبوعية لنشاطات الكليات والمراكز، مباشرة من الموقع الرسمي للجامعة</p>
        </div>
      </div>
      <div class="home-grid">
        <div class="col-main">
          <div class="pulse">
            <div class="pulse-head">
              <div>
                <div class="big" id="p-total">—</div>
                <div class="cap" data-i18n="pulseCap">نشاطاً وخبراً خلال آخر سبعة أيام</div>
              </div>
              <div class="side"><b id="p-units">—</b><span id="p-units-cap"></span></div>
            </div>
            <div class="days" id="p-days"></div>
            <div class="progress" id="p-progress"></div>
            <button class="report-btn" id="report">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
              <span data-i18n="shareReport">مشاركة التقرير الأسبوعي</span>
            </button>
          </div>

          <div class="card">
            <div class="section-head"><h2 data-i18n="topTitle">الأكثر نشاطاً هذا الأسبوع</h2><button class="link-btn" data-go="units" data-i18n="allUnits">كل الجهات</button></div>
            <ol class="rank" id="rank"></ol>
          </div>

          <div class="card">
            <h2 data-i18n="typesTitle">النشاطات حسب النوع</h2>
            <div class="stack" id="stack" role="img"></div>
            <div class="legend" id="legend"></div>
          </div>

          <div class="section-head"><h2 data-i18n="quickTitle">خدمات سريعة</h2><button class="link-btn" data-go="services" data-i18n="allServices">كل الخدمات</button></div>
          <div class="quick" id="quick"></div>
        </div>

        <div class="col-side">
          <div class="section-head"><h2 data-i18n="newsTitle">آخر أخبار الجامعة</h2><a href="https://uomosul.edu.iq/more-news/" target="_blank" rel="noopener" data-i18n="officialSite">الموقع الرسمي</a></div>
          <div class="list" id="news"></div>
        </div>
      </div>
    </section>

    <!-- النشاطات -->
    <section class="view" id="v-activities">
      <div class="toolbar">
        <div class="seg" id="seg-week">
          <button class="on" data-week="0" data-i18n="thisWeek">هذا الأسبوع</button>
          <button data-week="1" data-i18n="lastWeek">الأسبوع الماضي</button>
        </div>
        <div class="seg" id="seg-kind">
          <button class="on" data-kind="all" data-i18n="kindUnits">الكليات والمراكز</button>
          <button data-kind="hq" data-i18n="kindHQ">رئاسة الجامعة</button>
        </div>
        <select class="unit-picker" id="unit-picker"></select>
        <div class="chips" id="type-chips" role="group"></div>
        <input class="search" id="search" type="search" data-i18n-ph="searchActs" placeholder="ابحث في عناوين النشاطات">
        <div class="seg" id="seg-group">
          <button class="on" data-group="day" data-i18n="byDay">حسب اليوم</button>
          <button data-group="unit" data-i18n="byUnit">حسب الجهة</button>
        </div>
      </div>
      <div id="acts"></div>
    </section>

    <!-- الكليات -->
    <section class="view" id="v-units">
      <input class="search" id="unit-search" type="search" data-i18n-ph="searchUnits" placeholder="ابحث عن كلية أو مركز">
      <div id="unit-groups" class="units-wrap"></div>
    </section>

    <!-- الخدمات -->
    <section class="view" id="v-services">
      <h2 style="margin-top:4px" data-i18n="eSystems">الأنظمة الإلكترونية</h2>
      <div class="grid" id="services"></div>
    </section>

    <!-- عن الجامعة -->
    <section class="view" id="v-about"><div id="about"></div></section>
  </main>

  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  <div class="toast" id="toast" role="status"></div>

  <nav class="tabs">
    <div class="in">
      <button class="on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span data-i18n="tabHome">الرئيسية</span></button>
      <button data-tab="activities"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M7.5 13.5h3M7.5 17h6"/></svg><span data-i18n="tabActs">النشاطات</span></button>
      <button data-tab="units"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 12 4l9 5"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/></svg><span data-i18n="tabUnits">الكليات</span></button>
      <button data-tab="services"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg><span data-i18n="tabServices">الخدمات</span></button>
      <button data-tab="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span data-i18n="tabAbout">عن الجامعة</span></button>
    </div>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>

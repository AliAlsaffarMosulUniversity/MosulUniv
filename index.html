<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>جامعة الموصل</title>
  <meta name="description" content="التطبيق الرسمي لمتابعة أخبار ونشاطات كليات ومراكز جامعة الموصل">
  <meta name="theme-color" content="#12304f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <!-- iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="جامعة الموصل">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <img class="seal" src="https://uomosul.edu.iq/wp-content/uploads/2023/03/UOM-logo.png" alt="شعار جامعة الموصل"
           onerror="this.onerror=null;this.src='icons/icon-192.png'">
      <div class="titles">
        <h1>جامعة الموصل</h1>
        <div class="sub" id="today"></div>
      </div>
      <button class="icon-btn" id="refresh" aria-label="تحديث البيانات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="banner" id="banner" hidden></div>

    <!-- الرئيسية -->
    <section class="view on" id="v-home" aria-label="الرئيسية">
      <div class="pulse">
        <div class="pulse-head">
          <div>
            <div class="big" id="p-total">—</div>
            <div class="cap">نشاطاً وخبراً خلال آخر سبعة أيام</div>
          </div>
          <div class="side"><b id="p-units">—</b>جهة نشطة من أصل <span id="p-all"></span></div>
        </div>
        <div class="days" id="p-days"></div>
        <div class="progress" id="p-progress"></div>
      </div>

      <div class="section-head"><h2>خدمات سريعة</h2><button class="link-btn" data-go="services">كل الخدمات</button></div>
      <div class="quick" id="quick"></div>

      <div class="section-head"><h2>آخر أخبار الجامعة</h2><a href="https://uomosul.edu.iq/more-news/" target="_blank" rel="noopener">الموقع الرسمي</a></div>
      <div class="list" id="news"></div>
    </section>

    <!-- النشاطات الأسبوعية -->
    <section class="view" id="v-activities" aria-label="النشاطات الأسبوعية">
      <div class="toolbar">
        <div class="seg" id="seg-week">
          <button class="on" data-week="0">هذا الأسبوع</button>
          <button data-week="1">الأسبوع الماضي</button>
        </div>
        <div class="seg" id="seg-kind">
          <button class="on" data-kind="all">الكليات والمراكز</button>
          <button data-kind="hq">رئاسة الجامعة</button>
        </div>
        <select class="unit-picker" id="unit-picker" aria-label="اختر الجهة"></select>
        <div class="chips" id="type-chips" role="group" aria-label="نوع النشاط"></div>
        <input class="search" id="search" type="search" placeholder="ابحث في عناوين النشاطات" aria-label="بحث">
        <div class="seg" id="seg-group">
          <button class="on" data-group="day">حسب اليوم</button>
          <button data-group="unit">حسب الجهة</button>
        </div>
      </div>
      <div id="acts"></div>
    </section>

    <!-- الكليات والمراكز -->
    <section class="view" id="v-units" aria-label="الكليات والمراكز">
      <input class="search" id="unit-search" type="search" placeholder="ابحث عن كلية أو مركز" aria-label="بحث عن جهة">
      <div id="unit-groups"></div>
    </section>

    <!-- الخدمات -->
    <section class="view" id="v-services" aria-label="الخدمات الإلكترونية">
      <h2 style="margin-top:4px">الأنظمة الإلكترونية</h2>
      <div class="grid" id="services"></div>
    </section>

    <!-- عن الجامعة -->
    <section class="view" id="v-about" aria-label="عن الجامعة">
      <div id="about"></div>
    </section>
  </main>

  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  <div class="toast" id="toast" role="status"></div>

  <nav class="tabs" aria-label="التنقل الرئيسي">
    <div class="in">
      <button class="on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>الرئيسية</button>
      <button data-tab="activities"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M7.5 13.5h3M7.5 17h6"/></svg>النشاطات</button>
      <button data-tab="units"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 12 4l9 5"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 21h18"/></svg>الكليات</button>
      <button data-tab="services"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>الخدمات</button>
      <button data-tab="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>عن الجامعة</button>
    </div>
  </nav>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
